name: Addon Unit Tests

# Controls when the action will run.
on:
    # Triggers the workflow on push or pull request events but only for the master branch
    push:
        branches: [master, develop]
    pull_request:
        branches: [master, develop]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

    # Allows you to use this workflow as part of another workflow
    workflow_call:
        inputs:
            addon_slug:
                description: "Addon Slug"
                required: true
                type: string
            install_npm_packages:
                description: "Whether NPM needs to be run as part of the build"
                type: boolean
                required: false
                default: true
            php_matrix:
                description: "To be used in the strategy > matrix"
                type: string
                required: false
                default: "[ 7.4, 8.3 ]"
            givewp_branch:
                description: "GiveWP Branch"
                required: false
                type: string
                default: master

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains a single job called "test"
    test:
        # The type of runner that the job will run on
        runs-on: blacksmith-4vcpu-ubuntu-2404

        # The job reads the two checkouts and runs the test suite, nothing else.
        permissions:
            contents: read

        strategy:
            matrix:
                php: ${{ fromJson(inputs.php_matrix) }}
                mysql: ["mysql:5.6", "mysql:8.0"]
                # `minimum` is the "Requires at least" line of GiveWP's readme.txt. An add-on cannot
                # run on an older WordPress than the GiveWP it needs, so that is the real floor.
                wordpress: [minimum, latest]

        services:
            # This was a total pain to get setup. The default authentication plugin changed in MySQL 8 and is incompatible
            # with WordPress. So it needs to be set back to mysql_native_password. The best way to do this is to use the
            # command option in docker to apply it once the container is set up... but Github Actions does not support this.
            # The workaround is to execute the command in the options, but it is VITAL that it is the LAST option and that any
            # environment variables are added via options. DO NOT ADD THE ENV LINE IN YAML. You've been warned.
            # MySQL 5.6 accepts the same flag, so one service covers every matrix entry.
            # @see https://github.com/docker-library/mysql/issues/690
            mysql:
                image: ${{ matrix.mysql }}
                ports:
                    - 3306
                options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3 -e MYSQL_ROOT_PASSWORD=N0Tweak!@123! --entrypoint sh ${{ matrix.mysql }} -c "exec docker-entrypoint.sh mysqld --default-authentication-plugin=mysql_native_password"

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout Addon
              uses: actions/checkout@v7
              with:
                  path: ${{ inputs.addon_slug }}
                  # Nothing here pushes over git, and the job goes on to run third-party actions.
                  persist-credentials: false

            - name: Check out GiveWP ${{ inputs.givewp_branch }} branch
              uses: actions/checkout@v7
              with:
                  repository: impress-org/givewp
                  ref: ${{ inputs.givewp_branch }}
                  path: "give"
                  persist-credentials: false

            # @link https://github.com/spatie/laravel-activitylog/blob/master/.github/workflows/run-tests.yml
            - name: Set Up PHP for build
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: 7.4
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            - name: Store MySQL details in environment
              run: |
                  echo "mysql_port=${{ job.services.mysql.ports['3306'] }}" >> "$GITHUB_ENV"
                  echo "mysql_pass=N0Tweak!@123!" >> "$GITHUB_ENV"

            - name: Configure MySQL
              run: mysql -uroot --password='${{ env.mysql_pass}}' -h127.0.0.1 --port=${{env.mysql_port}}

            - name: Install svn
              run: |
                  sudo apt-get update
                  sudo apt-get install -y subversion

            - name: Install composer dependencies for GiveWP Core
              uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
              with:
                  working-directory: "./give"

            - name: Resolve the WordPress version
              working-directory: "./give"
              run: |
                  version=latest
                  if [ "$WORDPRESS" = minimum ]; then
                      version=$(sed -n 's/^Requires at least: *//p' readme.txt)
                      [[ "$version" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::No usable \"Requires at least\" in GiveWP's readme.txt: '$version'"; exit 1; }
                  fi
                  echo "wordpress_version=$version" >> "$GITHUB_ENV"
              env:
                  WORDPRESS: ${{ matrix.wordpress }}

            - name: Set UP GiveWP Core
              working-directory: "./give"
              run: bash tests/includes/bin/install.sh wordpress_develop_test root ${{ env.mysql_pass }} 127.0.0.1:${{ env.mysql_port }} ${{ env.wordpress_version }}

            - name: Set Up PHP for testing
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            - name: Reload Composer autoload
              working-directory: "./give"
              run: composer dump-autoload

            - name: Install composer dependencies for Addon
              uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
              with:
                  working-directory: ./${{ inputs.addon_slug }}

            - name: Setup Node
              uses: actions/setup-node@v7
              if: ${{ inputs.install_npm_packages }}
              with:
                  node-version: 18

            - name: Run npm build for addon
              if: ${{ inputs.install_npm_packages }}
              working-directory: ./${{ inputs.addon_slug }}
              run: |
                  npm ci
                  npm run dev

            - name: Run Addon Tests Against GiveWP
              working-directory: ./${{ inputs.addon_slug }}
              run: php -d memory_limit=-1 vendor/bin/phpunit
              env:
                  DB_PORT: ${{ env.mysql_port }}
