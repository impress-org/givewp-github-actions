name: 🔁 Sync Translations

on:
    workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
        inputs:
            ref:
                description: "Git Commit Ref (branch, tag, or hash)"
                required: true
                type: string
                default: "master"
            plugin_slug:
                description: "Plugin Slug"
                required: true
                type: string
        secrets:
            TRANSLATIONS_DEPLOY_HOST:
                required: true
            TRANSLATIONS_DEPLOY_USER:
                required: true
            TRANSLATIONS_DEPLOY_SSH_KEY:
                required: true
            TRANSLATIONS_DEPLOY_POT_LOCATION:
                required: true
    workflow_call:
        inputs:
            ref:
                description: "Git Commit Ref (branch, tag, or hash)"
                required: true
                type: string
                default: "master"
            plugin_slug:
                description: "Plugin Slug"
                required: true
                type: string
        secrets:
            TRANSLATIONS_DEPLOY_HOST:
                required: true
            TRANSLATIONS_DEPLOY_USER:
                required: true
            TRANSLATIONS_DEPLOY_SSH_KEY:
                required: true
            TRANSLATIONS_DEPLOY_POT_LOCATION:
                required: true

jobs:
    sync-translations:
        name: 🔁 Sync Translations
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}

            - uses: actions/setup-node@v7
              with:
                  node-version: "18"

            - name: Install npm dependencies & build for translation
              run: |
                  npm ci
                  npm run build

            - uses: $/.github/actions/generate-pot-file
              with:
                  plugin_path: ${{ github.workspace }}
                  pot_path: ${{github.workspace}}/languages/${{ inputs.plugin_slug }}.pot

            - uses: $/.github/actions/push-translations
              with:
                  plugin_slug: ${{ inputs.plugin_slug }}
              env:
                  TRANSLATIONS_DEPLOY_HOST: ${{ secrets.TRANSLATIONS_DEPLOY_HOST }}
                  TRANSLATIONS_DEPLOY_USER: ${{ secrets.TRANSLATIONS_DEPLOY_USER }}
                  TRANSLATIONS_DEPLOY_SSH_KEY: ${{ secrets.TRANSLATIONS_DEPLOY_SSH_KEY }}
                  TRANSLATIONS_DEPLOY_POT_LOCATION: ${{ secrets.TRANSLATIONS_DEPLOY_POT_LOCATION }}
