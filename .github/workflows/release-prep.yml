name: Release Prep

on:
    workflow_call:
        inputs:
            version_bump_type:
                description: "Type of version bump: automatic, major, feature, maintenance or hotfix"
                required: false
                default: "automatic"
                type: string
            release_version:
                description: "Specific target version to release (optional; overrides 'Type of version bump' if provided)"
                required: false
                default: ""
                type: string
            release_branch:
                description: "Name of the release branch to create/prepare (optional; e.g. release/4.17.0. If omitted, generated automatically from version)"
                required: false
                default: ""
                type: string
            base_branch:
                description: "Base branch to branch off of (e.g. develop)"
                required: false
                default: "develop"
                type: string
            release_date:
                description: "Release date (YYYY-MM-DD or 'today')"
                required: false
                default: "today"
                type: string
            target_pr_base:
                description: "Target base branch for the Release PR (e.g. master)"
                required: false
                default: "master"
                type: string
            install_npm_packages:
                description: "Whether npm ci needs to be run"
                required: false
                default: true
                type: boolean
            install_composer_packages:
                description: "Whether composer install needs to be run"
                required: false
                default: true
                type: boolean
            php_version:
                description: "PHP version to use"
                required: false
                default: "7.4"
                type: string
            node_version:
                description: "Node.js version to use"
                required: false
                default: "20"
                type: string
            pup_version:
                description: "stellarwp/pup release to use for the version bump and TBD replacement"
                required: false
                default: "2.0.0"
                type: string
            reviewers:
                description: "Comma-separated list of reviewer usernames"
                required: false
                default: "jonwaldstein,pauloiankoski,glaubersilva"
                type: string

jobs:
    prepare-release:
        name: "Prepare Release Branch & PR"
        runs-on: blacksmith-4vcpu-ubuntu-2404
        permissions:
            contents: write
            pull-requests: write

        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.base_branch }}
                    fetch-depth: 0

            -   name: Set up PHP
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
                with:
                    php-version: ${{ inputs.php_version }}
                    coverage: none

            # pup bumps every file in .puprc paths.versions and replaces TBD placeholders in
            # .puprc checks.tbd.dirs, so the same .puprc drives Give Core and every add-on.
            -   name: Set up pup
                id: current
                env:
                    PUP_VERSION: ${{ inputs.pup_version }}
                run: |
                    if [ ! -f .puprc ]; then
                        echo "::error::No .puprc found. Release prep reads the version files (paths.versions) and TBD dirs (checks.tbd.dirs) from it."
                        exit 1
                    fi

                    PUP="$RUNNER_TEMP/pup.phar"
                    curl -fsSL -o "$PUP" "https://github.com/stellarwp/pup/releases/download/${PUP_VERSION}/pup.phar"
                    # Keep PHP notices off stdout so get-version prints only the version.
                    echo "PUP=php -d display_errors=stderr $PUP" >> $GITHUB_ENV

                    VERSION=$(php -d display_errors=stderr "$PUP" get-version)
                    [ "$VERSION" = "unknown" ] && VERSION=""
                    echo "version=$VERSION" >> $GITHUB_OUTPUT

            -   name: Determine version
                id: version
                env:
                    CURRENT_VERSION: ${{ steps.current.outputs.version }}
                    INPUT_VERSION: ${{ inputs.release_version }}
                    BUMP_TYPE_INPUT: ${{ inputs.version_bump_type }}
                    INPUT_BRANCH: ${{ inputs.release_branch }}
                run: |
                    if [ -n "$INPUT_VERSION" ]; then
                        if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                            echo "::error::Invalid release_version '$INPUT_VERSION'. Expected format: N.N.N or N.N.N.N"
                            exit 1
                        fi
                        TARGET_VERSION="$INPUT_VERSION"
                    else
                        if [ -z "$CURRENT_VERSION" ]; then
                            echo "::error::Could not detect the current version."
                            exit 1
                        fi

                        # Callers forward dropdown labels like "feature (x.X.x)"; keep the first word.
                        BUMP_TYPE="${BUMP_TYPE_INPUT%% *}"

                        # For automatic, derive the bump from the highest `significance` declared in the
                        # changelog entries (changelogger's own concept), not from the entry `type`.
                        # major > minor > patch. -s keeps a missing changelog/ dir from failing the step.
                        if [ "$BUMP_TYPE" = "automatic" ]; then
                            if grep -rEqs --include='*.yaml' "^significance:[[:space:]]*['\"]?major" changelog/; then
                                BUMP_TYPE="major"
                            elif grep -rEqs --include='*.yaml' "^significance:[[:space:]]*['\"]?minor" changelog/; then
                                BUMP_TYPE="feature"
                            else
                                BUMP_TYPE="maintenance"
                            fi
                            echo "Auto-detected bump type from significance: $BUMP_TYPE"
                        fi

                        IFS='.' read -r -a parts <<< "$CURRENT_VERSION"
                        case "$BUMP_TYPE" in
                            major)
                                parts=($((parts[0] + 1)) 0 0)
                                ;;
                            feature)
                                parts=("${parts[0]}" $((parts[1] + 1)) 0)
                                ;;
                            maintenance)
                                # A patch on a version that already carries a hotfix increments
                                # the hotfix, matching changelogger's stellarwp versioning.
                                if [ "${parts[3]:-0}" -gt 0 ]; then
                                    parts[3]=$((parts[3] + 1))
                                else
                                    parts=("${parts[0]}" "${parts[1]}" $((parts[2] + 1)))
                                fi
                                ;;
                            hotfix)
                                parts[3]=$((${parts[3]:-0} + 1))
                                ;;
                            *)
                                echo "::error::Unknown version_bump_type '$BUMP_TYPE'."
                                exit 1
                                ;;
                        esac

                        TARGET_VERSION=$(IFS='.'; echo "${parts[*]}")
                    fi

                    echo "Current version: $CURRENT_VERSION, target version: $TARGET_VERSION"
                    echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT
                    echo "target_branch=${INPUT_BRANCH:-release/$TARGET_VERSION}" >> $GITHUB_OUTPUT

            -   name: Create or checkout release branch
                env:
                    RELEASE_BRANCH: ${{ steps.version.outputs.target_branch }}
                run: |
                    # Checking out a branch that only exists on origin creates the tracking branch.
                    git checkout "$RELEASE_BRANCH" 2>/dev/null || git checkout -b "$RELEASE_BRANCH"

            -   name: Install composer dependencies
                uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4
                if: ${{ inputs.install_composer_packages && hashFiles('composer.json') != '' }}

            -   uses: actions/setup-node@v7
                with:
                    node-version: ${{ inputs.node_version }}

            -   name: Install npm dependencies
                if: ${{ inputs.install_npm_packages && hashFiles('package-lock.json') != '' }}
                run: npm ci --prefer-offline --no-audit

            -   uses: impress-org/givewp-github-actions/.github/actions/prepare-changelog-strategy@master

            -   name: Run release preparation pipeline
                env:
                    VERSION: ${{ steps.version.outputs.target_version }}
                    DATE: ${{ inputs.release_date }}
                run: |
                    [ "$DATE" = "today" ] && DATE=""

                    # Same three steps as Give Core's bin/release-prep.sh.
                    $PUP replace-version "$VERSION"
                    $PUP replace-tbd "$VERSION"
                    npx --no-install changelogger write --overwrite-version "$VERSION" ${DATE:+--date "$DATE"}

            -   name: Commit and push release branch
                env:
                    RELEASE_BRANCH: ${{ steps.version.outputs.target_branch }}
                    TARGET_VERSION: ${{ steps.version.outputs.target_version }}
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"

                    if [ -n "$(git status --porcelain)" ]; then
                        git add -A
                        git commit -m "chore(release): prepare release ${TARGET_VERSION}"
                    else
                        echo "No changes detected to commit."
                    fi
                    # Always push the branch so gh pr create --head can find it,
                    # even when the release-prep script made no file changes.
                    git push origin "$RELEASE_BRANCH"

            -   name: Create Pull Request
                env:
                    GH_TOKEN: ${{ github.token }}
                    TARGET_BRANCH: ${{ steps.version.outputs.target_branch }}
                    TARGET_VERSION: ${{ steps.version.outputs.target_version }}
                    PR_BASE: ${{ inputs.target_pr_base }}
                    REVIEWERS: ${{ inputs.reviewers }}
                    ACTOR: ${{ github.actor }}
                    REPO_NAME: ${{ github.event.repository.name }}
                run: |
                    if [ "$(gh pr list --head "$TARGET_BRANCH" --base "$PR_BASE" --state open --json number --jq length)" != "0" ]; then
                        echo "PR already exists for $TARGET_BRANCH -> $PR_BASE, skipping creation."
                        exit 0
                    fi

                    # Create the PR without --label to avoid failure when labels
                    # are absent in the caller repository; apply labels only if they exist.
                    PR_URL=$(gh pr create \
                        --head "$TARGET_BRANCH" \
                        --base "$PR_BASE" \
                        --title "Release: ${TARGET_VERSION}" \
                        --body "## Release for ${REPO_NAME} ${TARGET_VERSION}" \
                        --assignee "$ACTOR")

                    LABELS=$(gh label list --json name --limit 200 --jq '.[].name')
                    for label in release automation; do
                        if grep -qx "$label" <<< "$LABELS"; then
                            gh pr edit "$PR_URL" --add-label "$label"
                        fi
                    done

                    # Request reviewers one at a time; a failure is reported but does not
                    # abort the step, so the PR is still created.
                    IFS=',' read -ra REVIEWER_ARRAY <<< "${REVIEWERS// /}"
                    for reviewer in "${REVIEWER_ARRAY[@]}"; do
                        gh pr edit "$PR_URL" --add-reviewer "$reviewer" || \
                            echo "::warning::Failed to request reviewer '$reviewer' on PR $PR_URL"
                    done

            -   name: Report summary
                env:
                    TARGET_VERSION: ${{ steps.version.outputs.target_version }}
                    TARGET_BRANCH: ${{ steps.version.outputs.target_branch }}
                    BASE_BRANCH: ${{ inputs.base_branch }}
                    PR_BASE: ${{ inputs.target_pr_base }}
                run: |
                    cat >> $GITHUB_STEP_SUMMARY <<EOF
                    ## Release Prep Completed
                    Release branch \`${TARGET_BRANCH}\` (from \`${BASE_BRANCH}\`, PR into \`${PR_BASE}\`) prepared for version \`${TARGET_VERSION}\`.
                    EOF
