name: Release Prep

on:
  workflow_call:
    inputs:
      version_bump_type:
        description: "Type of version bump"
        required: false
        default: "automatic"
        type: string
      release_version:
        description: "Specific target version to release (optional; overrides 'Type of version bump' if provided)"
        required: false
        default: ""
        type: string
      release_branch:
        description: "Name of the release branch to create/prepare (optional; e.g. release/4.17.0. If omitted, generated automatically from version)"
        required: false
        default: ""
        type: string
      base_branch:
        description: "Base branch to branch off of (e.g. develop)"
        required: false
        default: "develop"
        type: string
      release_date:
        description: "Release date (YYYY-MM-DD or 'today')"
        required: false
        default: "today"
        type: string
      target_pr_base:
        description: "Target base branch for the Release PR (e.g. master)"
        required: false
        default: "master"
        type: string
      install_npm_packages:
        description: "Whether npm ci needs to be run"
        required: false
        default: true
        type: boolean
      install_composer_packages:
        description: "Whether composer install needs to be run"
        required: false
        default: true
        type: boolean
      php_version:
        description: "PHP version to use"
        required: false
        default: "7.4"
        type: string
      node_version:
        description: "Node.js version to use"
        required: false
        default: "20"
        type: string
      reviewers:
        description: "Comma-separated list of reviewer usernames"
        required: false
        default: "jonwaldstein,pauloiankoski,glaubersilva"
        type: string

jobs:
  prepare-release:
    name: "Prepare Release Branch & PR"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Print inputs
        env:
          BUMP_TYPE: ${{ inputs.version_bump_type }}
          REL_VERSION: ${{ inputs.release_version }}
          REL_BRANCH: ${{ inputs.release_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          PR_BASE: ${{ inputs.target_pr_base }}
          REL_DATE: ${{ inputs.release_date }}
        run: |
          echo "### Release Prep Inputs" >> $GITHUB_STEP_SUMMARY
          echo "- Version Bump Type: \`${BUMP_TYPE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Specific Version: \`${REL_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Release Branch: \`${REL_BRANCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Base Branch: \`${BASE_BRANCH}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Target PR Base: \`${PR_BASE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Release Date: \`${REL_DATE}\`" >> $GITHUB_STEP_SUMMARY

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Set up Git configuration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: mbstring, intl, json
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Determine Version
        id: determine_version
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          BUMP_TYPE_INPUT: ${{ inputs.version_bump_type }}
          INPUT_BRANCH: ${{ inputs.release_branch }}
        run: |
          # 1. Detect current version from root plugin file, package.json, or .puprc
          CURRENT_VERSION=""
          if [ -f "package.json" ]; then
            CURRENT_VERSION=$(grep -Po '"version":\s*"\K[^"]+' package.json | head -n 1 || true)
          fi

          if [ -z "$CURRENT_VERSION" ]; then
            for file in $(find . -maxdepth 1 -name "*.php" -type f | sort); do
              CURRENT_VERSION=$(grep -Po '^\s*\*?\s*Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+(?:\.[0-9]+)?' "$file" | head -n 1 || true)
              if [ -n "$CURRENT_VERSION" ]; then
                break
              fi
            done
          fi

          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: Could not detect current version." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "Current detected version: $CURRENT_VERSION"

          # If an explicit version was provided, validate and use it directly
          if [ -n "$INPUT_VERSION" ]; then
            if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "Error: invalid release_version '$INPUT_VERSION'. Expected format: N.N.N or N.N.N.N" >&2
              exit 1
            fi
            TARGET_VERSION="$INPUT_VERSION"
          else
            BUMP_TYPE="${BUMP_TYPE_INPUT%% *}"

            # If automatic, inspect changelog/ directory to pick the highest bump level
            if [ "$BUMP_TYPE" = "automatic" ]; then
              echo "Inspecting changelog/ for highest change type..."
              if [ -d "changelog" ] && [ -n "$(find changelog -name '*.yml' -o -name '*.yaml' 2>/dev/null)" ]; then
                if grep -riq "^type:\s*['\"]*major" changelog/; then
                  BUMP_TYPE="major"
                elif grep -riq "^type:\s*['\"]*\(feature\|feat\)" changelog/; then
                  BUMP_TYPE="feature"
                elif grep -riq "^type:\s*['\"]*\(enhancement\|tweak\|fix\|security\)" changelog/; then
                  BUMP_TYPE="maintenance"
                else
                  BUMP_TYPE="maintenance"
                fi
              else
                BUMP_TYPE="maintenance"
              fi
              echo "Auto-detected bump type: $BUMP_TYPE"
            fi

            IFS='.' read -r -a parts <<< "$CURRENT_VERSION"
            case "$BUMP_TYPE" in
              major)
                parts[0]=$((parts[0] + 1))
                parts[1]=0
                parts[2]=0
                unset parts[3]
                ;;
              feature)
                parts[1]=$((parts[1] + 1))
                parts[2]=0
                unset parts[3]
                ;;
              maintenance)
                parts[2]=$((parts[2] + 1))
                unset parts[3]
                ;;
              hotfix)
                if [ -z "${parts[3]}" ]; then
                  parts[3]=1
                else
                  parts[3]=$((parts[3] + 1))
                fi
                ;;
              *)
                parts[2]=$((parts[2] + 1))
                unset parts[3]
                ;;
            esac

            TARGET_VERSION="${parts[0]}.${parts[1]}.${parts[2]}"
            if [ -n "${parts[3]}" ]; then
              TARGET_VERSION="$TARGET_VERSION.${parts[3]}"
            fi
          fi

          echo "Target version: $TARGET_VERSION"
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT

          # Determine release branch name
          BRANCH_NAME="$INPUT_BRANCH"
          if [ -z "$BRANCH_NAME" ]; then
            BRANCH_NAME="release/$TARGET_VERSION"
          fi
          echo "Target branch: $BRANCH_NAME"
          echo "target_branch=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create or checkout release branch
        env:
          RELEASE_BRANCH: ${{ steps.determine_version.outputs.target_branch }}
        run: |
          if git show-ref --quiet "refs/heads/$RELEASE_BRANCH" || git show-ref --quiet "refs/remotes/origin/$RELEASE_BRANCH"; then
            echo "Branch $RELEASE_BRANCH exists. Checking out."
            git checkout "$RELEASE_BRANCH" || git checkout -b "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          else
            echo "Creating branch $RELEASE_BRANCH from current ref."
            git checkout -b "$RELEASE_BRANCH"
          fi

      - name: Install composer dependencies
        if: ${{ inputs.install_composer_packages }}
        run: |
          if [ -f "composer.json" ]; then
            composer install --prefer-dist --no-progress
          fi

      - name: Install npm dependencies
        if: ${{ inputs.install_npm_packages }}
        run: |
          if [ -f "package.json" ]; then
            npm ci --prefer-offline --no-audit
          fi

      - name: Run release preparation pipeline
        env:
          VERSION: ${{ steps.determine_version.outputs.target_version }}
          DATE: ${{ inputs.release_date }}
        run: |
          DATE_ARG=""
          if [ "$DATE" != "today" ] && [ -n "$DATE" ]; then
            DATE_ARG="--date $DATE"
          fi

          if [ -f "bin/release-prep.sh" ]; then
            bin/release-prep.sh "$VERSION" $DATE_ARG
          else
            echo "No bin/release-prep.sh found; compiling changelog directly if write-changelog.sh exists..."
            if [ -f "bin/write-changelog.sh" ]; then
              bin/write-changelog.sh "$VERSION" $DATE_ARG
            fi
          fi

      - name: Commit and push release branch
        env:
          RELEASE_BRANCH: ${{ steps.determine_version.outputs.target_branch }}
          TARGET_VERSION: ${{ steps.determine_version.outputs.target_version }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(release): prepare release ${TARGET_VERSION}"
          else
            echo "No changes detected to commit."
          fi
          # Always push the branch so gh pr create --head can find it,
          # even when the release-prep script made no file changes.
          git push origin "$RELEASE_BRANCH"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.determine_version.outputs.target_branch }}
          TARGET_VERSION: ${{ steps.determine_version.outputs.target_version }}
          PR_BASE: ${{ inputs.target_pr_base }}
          REVIEWERS: ${{ inputs.reviewers }}
          ACTOR: ${{ github.actor }}
        run: |
          PR_TITLE="Release: ${TARGET_VERSION}"
          PR_BODY="## Release for GiveWP ${TARGET_VERSION}"

          if gh pr list --head "$TARGET_BRANCH" --base "$PR_BASE" --state open --json number | grep -q '"number"'; then
            echo "PR already exists for $TARGET_BRANCH -> $PR_BASE, skipping creation."
          else
            # Create the PR without --label to avoid failure when labels
            # are absent in the caller repository; apply labels only if they exist.
            PR_URL=$(gh pr create \
              --head "$TARGET_BRANCH" \
              --base "$PR_BASE" \
              --title "$PR_TITLE" \
              --body "$PR_BODY" \
              --assignee "$ACTOR")

            # Apply labels only if they already exist in the repository.
            for label in release automation; do
              if gh label list --json name --limit 200 | grep -q "\"$label\""; then
                gh pr edit "$PR_URL" --add-label "$label"
              fi
            done

            # Request reviewers; a failure here is reported but does not
            # abort the step, so the PR is still created.
            IFS=',' read -ra REVIEWER_ARRAY <<< "$REVIEWERS"
            for reviewer in "${REVIEWER_ARRAY[@]}"; do
              reviewer=$(echo "$reviewer" | xargs)
              if [ -n "$reviewer" ]; then
                gh pr edit "$PR_URL" --add-reviewer "$reviewer" || \
                  echo "::warning::Failed to request reviewer '$reviewer' on PR $PR_URL"
              fi
            done
          fi

      - name: Report Summary
        env:
          TARGET_VERSION: ${{ steps.determine_version.outputs.target_version }}
          TARGET_BRANCH: ${{ steps.determine_version.outputs.target_branch }}
        run: |
          echo "## Release Prep Completed" >> $GITHUB_STEP_SUMMARY
          echo "Release branch \`${TARGET_BRANCH}\` prepared for version \`${TARGET_VERSION}\`." >> $GITHUB_STEP_SUMMARY
