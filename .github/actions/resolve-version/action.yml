name: Resolve Version
description: Find the files the plugin version lives in and read the current version from the first one

outputs:
    version:
        description: 'The current version, or empty when none was found'
        value: ${{ steps.version.outputs.version }}
    version_files:
        description: 'JSON array of {file, regex} entries the version lives in'
        value: ${{ steps.files.outputs.version_files }}

runs:
    using: "composite"
    steps:
        -   name: Resolve the files the version lives in
            id: files
            shell: bash
            run: |
                # Version metadata, in order of preference:
                #
                #   1. `_version_files` in package.json
                #   2. `paths.versions` in .puprc
                #   3. the `Stable tag` header in readme.txt
                #
                # GiveWP core declares all three; add-ons only have a readme, and without this fallback
                # they end up with an empty version.
                if [ -f package.json ] && jq -e 'has("_version_files")' package.json > /dev/null 2>&1; then
                    VERSION_FILES=$(jq -c '._version_files' package.json)
                elif [ -f .puprc ] && jq -e '.paths.versions' .puprc > /dev/null 2>&1; then
                    VERSION_FILES=$(jq -c '.paths.versions' .puprc)
                elif [ -f readme.txt ]; then
                    # Casing of the readme header isn't consistent across repos.
                    VERSION_FILES='[{"file":"readme.txt","regex":"([Ss]table [Tt]ag: )(.+)"}]'
                else
                    VERSION_FILES='[]'
                fi

                echo "VERSION_FILES=$VERSION_FILES" >> $GITHUB_ENV
                echo "version_files=$VERSION_FILES" >> $GITHUB_OUTPUT

        -   name: Fetch version from version files
            id: version
            shell: bash
            run: |
                FILE=$(echo "$VERSION_FILES" | jq -r '.[0].file // ""')
                REGEX=$(echo "$VERSION_FILES" | jq -r '.[0].regex // ""')

                VERSION=''

                if [ -n "$FILE" ] && [ -f "$FILE" ]; then
                    # Extract the version number using grep and sed. No match (grep exit 1) leaves the
                    # version empty; a real grep error (exit 2) still fails the step under pipefail.
                    VERSION=$({ grep -o -E "$REGEX" "$FILE" || [ $? -eq 1 ]; } | head -n 1 | sed -E "s/$REGEX/\2/" | tr -d '[:space:]')
                fi

                echo "VERSION=$VERSION" >> $GITHUB_ENV
                echo "version=$VERSION" >> $GITHUB_OUTPUT
