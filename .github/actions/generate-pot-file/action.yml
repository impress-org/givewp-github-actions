name: 🪴 Generate POT File
description: Generate a POT file from the plugin source code

inputs:
    plugin_path:
        description: 'The path to the plugin source code. Used to search for files to translate.'
        required: true
    pot_path:
        description: 'The path to the POT file to sync'
        required: true

runs:
    using: "composite"
    steps:
        -   name: Generate POT file
            shell: bash
            run: |
                curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
                chmod +x wp-cli.phar
                mv wp-cli.phar /usr/local/bin/wp
                # Assets must already be built. Plugins built with webpack ship their compiled JS, so only the
                # .distignore list and source maps are excluded; otherwise the JS sources are scanned directly.
                if [ -f "webpack.config.js" ]; then
                    php -d xdebug.mode=off "$(which wp)" i18n make-pot ${{ inputs.plugin_path }} ${{ inputs.pot_path }} --exclude="$(cat .distignore | tr "\n" "," | sed 's/,$/ /' | tr " " "\n"),*.js.map"
                else
                    php -d xdebug.mode=off "$(which wp)" i18n make-pot ${{ inputs.plugin_path }} ${{ inputs.pot_path }} --exclude="$(cat .distignore | tr "\n" "," | sed 's/,$/ /' | tr " " "\n"),src/*.js,src/**/*.js,*.js.map,blocks/**/*.js"
                fi
